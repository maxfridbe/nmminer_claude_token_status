# Builds the generic firmware for every board (no config: boards set
# themselves up on screen) on each push to main, and for a version tag also
# publishes it as the GitHub release that flashonly.sh and on-device updates use.
name: Firmware release

on:
  push:
    branches: [main]      # every push: build all boards, attach them to the run
    tags: ["v*"]          # a version tag: also publish a release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: |
          python -m venv .toolchain
          .toolchain/bin/pip install --quiet platformio

      # PlatformIO's package servers occasionally reset connections; fetch
      # everything first, with retries, so the build itself never downloads.
      - name: Fetch toolchains and libraries
        run: |
          for attempt in 1 2 3; do
            .toolchain/bin/pio pkg install -e cyd -e nmtv && exit 0
            echo "Fetch attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Build firmware image
        env:
          FW_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          UPDATE_REPO: ${{ github.repository }}
        run: tools/make_release.sh

      - name: Check the image embeds no config or credentials
        run: |
          test ! -e include/secrets.h
          for f in firmware/*.bin; do
            if strings -n 6 "$f" | grep -E 'sk-ant-|oat01-|ort01-'; then
              echo "Token-like strings in $f"; exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: claude-status-firmware-${{ github.ref_name }}
          path: firmware/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" firmware/*.bin firmware/*.sha256 \
            --title "claude-status $GITHUB_REF_NAME" \
            --notes "Generic firmware per board: claude-status-cyd.bin (ESP32-2432S028 Cheap Yellow Display) and claude-status-nmtv.bin (NMMiner NM-TV 1.54in). New board: ./flashonly.sh. Board on v26.09.02 or later: hold the screen, Update firmware. The -app.bin files are the over-the-air images; claude-status.bin and claude-status-app.bin are the CYD build under its old names. See the README." \
            --generate-notes
