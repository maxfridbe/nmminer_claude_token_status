; Claude usage dashboard for the ESP32-2432S028 "Cheap Yellow Display"
[env]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800
; Two 1.875MB app slots so the board can update itself over the air. NVS sits
; at the same place as in huge_app.csv, so switching keeps settings and logins.
board_build.partitions = min_spiffs.csv
build_src_filter = +<*> -<probe/>        ; the probe is its own firmware (env:nmtv-probe)

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  bblanchon/ArduinoJson@^7.2.0
  ricmoo/QRCode@^0.0.1

; --- flags every board shares
[common]
flags =
  -D USER_SETUP_LOADED=1
  -D USE_HSPI_PORT=1
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D DISABLE_ALL_LIBRARY_WARNINGS=1     ; touch runs via XPT2046_Touchscreen, not TFT_eSPI
  ; Stamped by the build scripts (the release tag on GitHub, git describe locally)
  '-D FW_VERSION="${sysenv.FW_VERSION}"'
  '-D UPDATE_REPO="${sysenv.UPDATE_REPO}"'

; --- ESP32-2432S028 "Cheap Yellow Display": 2.8" 320x240 ILI9341, resistive touch
[cyd]
flags =
  -D BOARD_CYD=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  ; This panel powers up color-inverted; send INVON after init to correct it.
  -D TFT_INVERSION_ON=1
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000

; --- NMMiner NM-TV: 1.54" 240x240 ST7789, one touch button. Pins from NMTech's
; custom-firmware guide. Not yet run on hardware: inversion, color order and
; rotation are best guesses to confirm on the first flash.
[nmtv]
flags =
  -D BOARD_NMTV=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=19
  -D TFT_BACKLIGHT_ON=LOW
  -D TFT_INVERSION_ON=1
  -D SPI_FREQUENCY=40000000

; --- builds. The generic images (no secrets.h) set themselves up on the board.
[env:cyd]
build_flags = ${common.flags} ${cyd.flags}

; No network, no credentials: fake data that changes every other check,
; checking every 45s. Labelled DEMO on screen. DEMO_ACCOUNTS=1..4 in the
; environment of deploy_and_build.sh previews each layout.
[env:cyd-demo]
build_flags = ${common.flags} ${cyd.flags}
  -D DEMO_DATA=1
  -D CHECK_INTERVAL_MS=45000UL

[env:nmtv]
build_flags = ${common.flags} ${nmtv.flags}

[env:nmtv-demo]
build_flags = ${common.flags} ${nmtv.flags}
  -D DEMO_DATA=1
  -D CHECK_INTERVAL_MS=45000UL

; Finds the NM-TV's touch button: logs every candidate pin that changes while
; you touch it. Flash, open the serial monitor, touch the button a few times.
[env:nmtv-probe]
build_src_filter = -<*> +<probe/>
build_flags = ${common.flags} ${nmtv.flags}
