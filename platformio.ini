; Claude usage dashboard for the ESP32-2432S028 "Cheap Yellow Display"
[env]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800
board_build.partitions = huge_app.csv

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^7.2.0

build_flags =
  ; --- TFT_eSPI configured here, so the library's User_Setup.h is never touched ---
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  ; This panel powers up color-inverted; send INVON after init to correct it.
  -D TFT_INVERSION_ON=1
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D DISABLE_ALL_LIBRARY_WARNINGS=1     ; no touch controller in use

; Real device: needs include/secrets.h, generated from your local Claude
; credentials by build.sh / deploy.sh.
[env:cyd]

; No network, no credentials: fake data that changes every other check,
; checking every 45s. Labelled DEMO on screen.
[env:cyd-demo]
build_flags = ${env.build_flags}
  -D DEMO_DATA=1
  -D CHECK_INTERVAL_MS=45000UL
